<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>企画一覧｜暁秀祭2027</title>

  <style>
    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
      background: #f7f9ff;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #4f8cff, #7b5cff);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin-top: 10px;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .category {
      margin-bottom: 50px;
    }

    .category h2 {
      border-left: 6px solid #5b7cff;
      padding-left: 12px;
      font-size: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .thumbnail {
      height: 160px;
      background: #e8edff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      color: #667;
    }

    .card h3 {
      margin: 10px 0;
      font-size: 22px;
    }

    .card p {
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background: #5b7cff;
      color: white;
      text-decoration: none;
      border-radius: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>企画一覧</h1>
  <p>暁秀祭2027</p>
</header>

<main class="container">

  <section class="category">
    <h2>生徒企画</h2>

    <div class="cards">

      <div class="card">
        <div class="thumbnail">
          中学合唱サムネイル
        </div>
        <h3>中学合唱</h3>
        <p>
          各クラスの合唱企画を紹介します。
        </p>
      </div>

      <div class="card">
        <div class="thumbnail">
          高校生徒企画サムネイル
        </div>
        <h3>高校生徒企画</h3>
        <p>
          高校生による企画を紹介します。
        </p>
      </div>

      <div class="card">
        <div class="thumbnail">
          部活動サムネイル
        </div>
        <h3>部活動</h3>
        <p>
          各部活動の企画を紹介します。
        </p>
      </div>

    </div>
  </section>


  <section class="category">
    <h2>ステージ企画</h2>

    <div class="cards">

      <div class="card">
        <div class="thumbnail">
          暁秀王サムネイル
        </div>
        <h3>暁秀王</h3>
        <p>
          出演者やパフォーマンスを紹介します。
        </p>
      </div>

      <div class="card">
        <div class="thumbnail">
          GGTサムネイル
        </div>
        <h3>GGT</h3>
        <p>
          出演グループを紹介します。
        </p>
      </div>

    </div>
  </section>

  <a href="index.html" class="back">
    ホームへ戻る
  </a>

</main>

</body>
</html>
